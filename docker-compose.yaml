services:
  auth:
    build:
      context: ./auth-service
      target: final
    ports:
      - 8081:8081
    environment:
      - HTTP_HOST=0.0.0.0
      - AUTH_PORT=8081
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_LOGIN=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=task_manager
      - DATABASE_SSLMODE=disable
      - JWT_SECRET=super_secret_key_12345
    depends_on:
      db:
        condition: service_healthy
  task:
    build:
        context: ./task-service
        target: final
    ports:
        - 8082:8082
    environment:
      - HTTP_HOST=0.0.0.0
      - TASK_PORT=8082
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_LOGIN=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=task_manager
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PASSWORD= 
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_key_12345
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=task_manager
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./auth-service/migrations/users.sql:/docker-entrypoint-initdb.d/01_users.sql
      - ./task-service/migrations/tasks.sql:/docker-entrypoint-initdb.d/02_tasks.sql
    healthcheck:
      test: ["CMD","pg_isready","-U","postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
volumes:
  db-data: 
